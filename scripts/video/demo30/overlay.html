<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TERRA 2045 · demo de 30 segundos · capa de textos y capturas</title>
<!-- Dibuja un cuadro de la capa superior del video para un instante dado: window.render(segundos). Lleva los textos, las
     cuatro capturas reales de la aplicación (el globo con El Niño y tres vistas de la plataforma) y los resaltes. Donde el fondo queda
     transparente se ven las cinemáticas en 3D (cine/) y el cierre, que pone build.py debajo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --accent: #5eead4; --warm: #ffd166; --hot: #ff5a4f; --ink: #04080c; --text: #f4f7f9; --muted: #c6d1d8; }
  html, body { margin: 0; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--text);
    font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage > * { position: absolute; }
  #bg { inset: 0; background: var(--ink); opacity: 0; }
  #flash { inset: 0; background: #fff; opacity: 0; }
  .bars { inset: 0; opacity: 0; }
  .bars::before, .bars::after { content: ""; position: absolute; left: 0; right: 0; height: 64px; background: #000; }
  .bars::before { top: 0; } .bars::after { bottom: 0; }
  .scene { left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; opacity: 0; will-change: transform, opacity; }
  .scene img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .hl { position: absolute; border: 3px solid var(--accent); border-radius: 10px; opacity: 0;
    box-shadow: 0 0 0 3000px rgba(2, 5, 9, .6), 0 0 34px rgba(94, 234, 212, .55); }
  .hl.soft { box-shadow: 0 0 0 3000px rgba(2, 5, 9, .3), 0 0 34px rgba(94, 234, 212, .55); }   /* deja ver el resto de la pantalla */
  .hl.warm { border-color: var(--warm); box-shadow: 0 0 0 3000px rgba(2, 5, 9, .6), 0 0 34px rgba(255, 209, 102, .55); }
  .scrim { inset: 0; opacity: 0; pointer-events: none; }
  #scrimL { background: linear-gradient(90deg, rgba(2, 5, 10, .92) 0%, rgba(2, 5, 10, .72) 26%, rgba(2, 5, 10, 0) 54%); }
  #scrimB { background: linear-gradient(0deg, rgba(2, 5, 10, .9) 0%, rgba(2, 5, 10, .62) 20%, rgba(2, 5, 10, 0) 44%); }
  /* Franjas casi opacas sobre las capturas de la plataforma: ningún rótulo queda encima de otro texto. */
  #bandT { background: linear-gradient(180deg, rgb(4, 8, 12) 0, rgb(4, 8, 12) 84px, rgba(4, 8, 12, 0) 108px); }
  #bandB { background: linear-gradient(0deg, rgb(4, 8, 12) 0, rgb(4, 8, 12) 224px, rgba(4, 8, 12, 0) 240px); }
  #bandB3 { background: linear-gradient(0deg, rgb(4, 8, 12) 0, rgb(4, 8, 12) 130px, rgba(4, 8, 12, 0) 150px); }
  #bandB2 { background: linear-gradient(0deg, rgb(4, 8, 12) 0, rgb(4, 8, 12) 330px, rgba(4, 8, 12, 0) 390px); }
  #scrimEnd { background: linear-gradient(180deg, rgba(2, 5, 10, .55) 0%, rgba(2, 5, 10, .1) 52%, rgba(2, 5, 10, .72) 100%); }
  .t { opacity: 0; will-change: transform, opacity; }
  .kicker { font: 600 20px/1.35 "IBM Plex Mono", Menlo, monospace; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); white-space: nowrap; text-shadow: 0 2px 14px rgba(0, 0, 0, .95); }
  .kicker i { display: inline-block; width: 11px; height: 11px; margin-right: 13px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 14px var(--hot); vertical-align: 1px; }
  .kicker.warm { color: var(--warm); }
  .kicker.pill { padding: 10px 16px; border-radius: 8px; background: rgba(4, 8, 12, .62); }   /* sobre cielos y nieve claros */
  .kicker small { display: block; margin-top: 7px; font-size: 16px; font-weight: 500; letter-spacing: .1em; color: var(--muted); }
  .h { font-weight: 800; font-size: 92px; line-height: 1.0; letter-spacing: -.025em; text-shadow: 0 3px 34px rgba(0, 0, 0, .75); white-space: nowrap; }
  .h.m { font-size: 72px; } .h.center { left: 0; width: 1920px; text-align: center; }
  .year { font: 600 220px/0.9 "IBM Plex Mono", Menlo, monospace; letter-spacing: -.02em; text-shadow: 0 4px 60px rgba(0, 0, 0, .8); }
  .sub { font-weight: 600; font-size: 44px; line-height: 1.15; color: var(--text); white-space: nowrap; text-shadow: 0 2px 22px rgba(0, 0, 0, .9); }
  .src { font: 500 17px/1.4 "IBM Plex Mono", Menlo, monospace; letter-spacing: .05em; color: #c2ced6; white-space: nowrap; text-shadow: 0 1px 10px rgba(0, 0, 0, 1); }
  .chips { left: 0; width: 1920px; bottom: 136px; display: flex; justify-content: center; gap: 18px; opacity: 0; }
  .chips span { padding: 15px 28px; border: 2px solid rgba(198, 209, 216, .35); border-radius: 999px; background: rgba(4, 8, 12, .9);
    font-weight: 700; font-size: 36px; color: rgba(244, 247, 249, .5); white-space: nowrap; }
  .chips span.on { border-color: var(--accent); background: var(--accent); color: #032019; box-shadow: 0 0 34px rgba(94, 234, 212, .5); }
  .chips span.done { border-color: var(--accent); color: var(--text); }
  .chips span.done::before, .chips span.on::before { content: "✓ "; }
  .tag { right: 64px; top: 92px; padding: 9px 16px; border: 1px solid rgba(244, 247, 249, .45); border-radius: 8px; background: rgba(4, 8, 12, .6);
    font: 500 16px/1 "IBM Plex Mono", Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--text); }
  /* Desastres: tipo, lugar y el paso de la misión que se muestra. */
  .hazard { left: 96px; bottom: 150px; }
  .hazard .place { font: 600 24px/1 "IBM Plex Mono", Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); text-shadow: 0 2px 14px rgba(0, 0, 0, 1); }
  .hazard .place::before { content: "◉ "; }
  .hazard .name { margin-top: 10px; font-weight: 800; font-size: 150px; line-height: .95; letter-spacing: -.03em; text-transform: uppercase; text-shadow: 0 4px 44px rgba(0, 0, 0, .85); }
  .step { right: 96px; bottom: 170px; padding: 16px 26px; border-radius: 14px; background: rgba(4, 8, 12, .82); border: 2px solid var(--accent); font-weight: 700; font-size: 38px; white-space: nowrap; }
  #subs { left: 0; width: 1920px; bottom: 76px; text-align: center; opacity: 0; }
  #subs span { display: inline-block; padding: 7px 18px; border-radius: 8px; background: rgba(2, 5, 9, .82); font-weight: 500; font-size: 27px; line-height: 1.25; color: #fff; }
  #marca_si { right: 26px; bottom: 22px; font: 500 15px/1 "IBM Plex Mono", Menlo, monospace; letter-spacing: .06em; color: rgba(244, 247, 249, .88); text-shadow: 0 1px 6px rgba(0, 0, 0, 1); opacity: 1; }
  #end { left: 0; top: 0; width: 1920px; height: 1080px; text-align: center; }
  #end > * { position: absolute; left: 0; width: 1920px; opacity: 0; }
  #fin_titulo { top: 140px; font-weight: 800; font-size: 150px; letter-spacing: .2em; text-indent: .2em; text-shadow: 0 4px 60px rgba(0, 0, 0, .7); }
  #fin_sub { top: 322px; font: 500 30px/1 "IBM Plex Mono", Menlo, monospace; letter-spacing: .62em; text-indent: .62em; text-transform: uppercase; color: var(--accent); }
  #fin_lema { top: 398px; font-weight: 600; font-size: 46px; text-shadow: 0 2px 26px rgba(0, 0, 0, .85); }
  #fin_equipo { top: 838px; font-weight: 700; font-size: 36px; text-shadow: 0 2px 22px rgba(0, 0, 0, .95); }
  #fin_nombres { top: 890px; font-weight: 500; font-size: 21px; color: var(--muted); text-shadow: 0 2px 16px rgba(0, 0, 0, 1); }
  #fin_reto { top: 936px; font: 500 22px/1.2 "IBM Plex Mono", Menlo, monospace; letter-spacing: .08em; color: var(--accent); text-shadow: 0 2px 18px rgba(0, 0, 0, 1); }
  #fin_creditos { top: 982px; font: 400 15px/1.3 "IBM Plex Mono", Menlo, monospace; letter-spacing: .02em; color: #dbe4e9; text-shadow: 0 1px 10px rgba(0, 0, 0, 1); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>

  <!-- Capturas reales de la aplicación (2880 × 1620), en el sistema de coordenadas de la pantalla (1920 × 1080). -->
  <div class="scene" id="sc-mar"><img data-src="globo-mar-pacifico-limpio.jpg" alt=""></div>
  <div class="scene" id="sc-plataforma"><img data-src="plataforma-temperatura.jpg" alt="">
    <div class="hl soft" id="hl-serie" style="left:192px;top:520px;width:1716px;height:228px"></div></div>
  <div class="scene" id="sc-preguntas"><img data-src="plataforma-preguntas.jpg" alt="">
    <div class="hl" id="hl-q0" style="left:262px;top:142px;width:1394px;height:153px"></div>
    <div class="hl" id="hl-q1" style="left:262px;top:299px;width:1394px;height:153px"></div>
    <div class="hl" id="hl-q2" style="left:262px;top:456px;width:1394px;height:153px"></div>
    <div class="hl" id="hl-q3" style="left:262px;top:613px;width:1394px;height:267px"></div></div>
  <div class="scene" id="sc-artefacto"><img data-src="fuentes-artefacto.jpg" alt=""><div class="hl warm" id="hl-art" style="left:262px;top:302px;width:1394px;height:109px"></div></div>

  <div class="scrim" id="scrimL"></div>
  <div class="scrim" id="scrimB"></div>
  <div class="scrim" id="bandT"></div>
  <div class="scrim" id="bandB"></div>
  <div class="scrim" id="bandB2"></div>
  <div class="scrim" id="bandB3"></div>
  <div class="scrim" id="scrimEnd"></div>
  <div class="bars" id="bars"></div>
  <div id="flash"></div>

  <!-- Luna, 2045 -->
  <div class="t kicker" id="k_presenta" style="left:96px;top:112px" data-t="k_presenta"></div>
  <div class="t year" id="h_2045" style="left:84px;top:170px" data-t="h_2045"></div>
  <div class="t sub" id="sub_2045" style="left:98px;top:392px" data-t="sub_2045"></div>
  <!-- El salto -->
  <div class="t year" id="contador" style="left:0;width:1920px;text-align:center;top:150px;font-size:170px"></div>
  <div class="t h m center" id="h_vuelves" style="top:880px" data-t="h_vuelves"></div>
  <!-- Llegada a 2026 y el dato real -->
  <div class="t h" id="h_herramienta" style="left:96px;top:344px;font-size:84px" data-t="h_herramienta"></div>
  <div class="t kicker" id="k_mar" style="left:96px;top:112px"><i></i><span data-t="k_mar"></span><small data-t="k_mar2"></small></div>
  <div class="t src" id="src_emergencia" style="left:98px;top:640px" data-t="src_emergencia"></div>
  <!-- Desastres -->
  <div class="t kicker pill" id="k_lugares" style="left:80px;top:86px" data-t="k_lugares"></div>
  <div class="t hazard" id="hazard"><div class="place"></div><div class="name"></div></div>
  <div class="t step" id="step"></div>
  <div class="t tag" id="tag"></div>
  <!-- Las preguntas del reto y la segunda fuente -->
  <div class="t kicker" id="k_plataforma" style="left:0;width:1920px;text-align:center;top:44px" data-t="k_plataforma"></div>
  <div class="t kicker" id="k_reto" style="left:0;width:1920px;text-align:center;top:44px" data-t="k_reto"></div>
  <div class="chips" id="chips"><span></span><span></span><span></span><span></span></div>
  <div class="t kicker warm" id="k_artefacto" style="left:96px;top:772px" data-t="k_artefacto"></div>
  <div class="t h m" id="h_decimos" style="left:96px;top:810px" data-t="h_decimos"></div>
  <!-- La Tierra sana -->
  <div class="t kicker" id="k_para" style="left:0;width:1920px;text-align:center;top:836px" data-t="k_para"></div>
  <div class="t h m center" id="h_futuro" style="top:876px" data-t="h_futuro"></div>
  <!-- Cierre -->
  <div id="end">
    <div id="fin_titulo" data-t="fin_titulo"></div>
    <div id="fin_sub" data-t="fin_sub"></div>
    <div id="fin_lema" data-t="fin_lema"></div>
    <div id="fin_equipo" data-t="fin_equipo"></div>
    <div id="fin_nombres" data-t="fin_nombres"></div>
    <div id="fin_reto" data-t="fin_reto"></div>
    <div id="fin_creditos" data-t="fin_creditos"></div>
  </div>
  <div id="subs"><span></span></div>
  <div id="marca_si" data-t="marca_si"></div>
</div>
<script>
  let SPEC = null;
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const mix = (a, b, x) => a + (b - a) * clamp(x);
  const out3 = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  /** Opacidad de algo que está en pantalla entre a y b, con entrada y salida suaves. */
  const win = (t, a, b, fi = 0.3, fo = 0.25) => clamp(Math.min((t - a) / fi, (b - t) / fo));

  /** Texto: aparece subiendo un poco y se va sin moverse. */
  function text(id, t, a, b, fi = 0.4, fo = 0.22, rise = 28) {
    const el = $(id);
    el.style.opacity = win(t, a, b, fi, fo).toFixed(4);
    el.style.transform = `translateY(${((1 - out3((t - a) / fi)) * rise).toFixed(2)}px)`;
  }
  /** Cámara sobre una captura: el punto (cx, cy) queda en el centro de la pantalla con escala s. */
  function cam(id, cx, cy, s, opacity) {
    const el = $(id);
    el.style.opacity = opacity.toFixed(4);
    if (opacity > 0) el.style.transform = `translate(${(960 - cx * s).toFixed(3)}px, ${(540 - cy * s).toFixed(3)}px) scale(${s.toFixed(5)})`;
  }
  const show = (id, o) => { $(id).style.opacity = clamp(o).toFixed(4); };

  window.setup = async (spec) => {
    SPEC = spec;
    document.documentElement.lang = spec.lang;
    document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = spec.textos[el.dataset.t] ?? ""; });
    [...$("chips").children].forEach((el, i) => { el.textContent = spec.textos.chips[i]; });
    const images = [...document.querySelectorAll("img[data-src]")];
    images.forEach((img) => { img.src = spec.tomas + img.dataset.src; });
    await Promise.all(images.map((img) => img.decode()));
    await document.fonts.ready;
    await Promise.all(["800 92px 'Public Sans'", "700 38px 'Public Sans'", "600 44px 'Public Sans'", "500 27px 'Public Sans'", "600 220px 'IBM Plex Mono'", "600 20px 'IBM Plex Mono'", "500 16px 'IBM Plex Mono'", "400 15px 'IBM Plex Mono'"].map((f) => document.fonts.load(f)));
    return { fuentes: [...new Set([...document.fonts].filter((f) => f.status === "loaded").map((f) => `${f.family} ${f.weight}`))], tomas: images.length };
  };

  window.render = (t) => {
    const P = SPEC.planos, V = SPEC.voz;
    /** Segundo de la cinemática en que empieza el plano: los tiempos de cada escena se cuentan desde su propio inicio. */
    const offset = (name) => (SPEC.segmentos.find((s) => s.escena === name) || {}).desde_s || 0;
    const turn = P.llegada[0] + 1.55 - offset("llegada");      // la Tierra en 3D se vuelve el globo real de la aplicación
    // Fondo opaco solo mientras hay capturas de la plataforma; el resto del tiempo se ve la cinemática de abajo.
    show("bg", win(t, P.preguntas[0] - 0.02, P.fuentes[1] + 0.02, 0.02, 0.02));
    // Franjas de cine sobre las cinemáticas en 3D.
    show("bars", Math.max(win(t, -1, turn + 0.05, 0.01, 0.5), win(t, P.desastres[0], P.desastres[1], 0.15, 0.15), win(t, P.sana[0], P.cierre[1] + 1, 0.2, 0.2)));
    const cine = t < turn || (t >= P.sana[0] && t < P.sana[1]);
    let left = 0, bottom = 0;

    // --- Luna, 2045: quiénes somos y dónde empieza la historia. La Tierra está en caos.
    {
      const [a, b] = P.luna;
      text("k_presenta", t, a + 0.25, a + 2.0, 0.4, 0.3, 0);
      text("h_2045", t, a + 0.7, b - 0.1, 0.5, 0.25, 34);
      text("sub_2045", t, a + 1.3, b - 0.1, 0.45, 0.25);
      left = Math.max(left, win(t, a + 0.6, b + 0.1, 0.5, 0.3) * 0.75);
    }
    // --- El salto: la pregunta, mientras el contador retrocede de 2045 a 2026.
    {
      const [a, b] = P.salto, off = offset("salto"), w0 = a + 1.15 - off, w1 = a + 2.8 - off, k = prog(t, w0 + 0.1, w1 - 0.05);
      const year = $("contador");
      year.textContent = String(Math.round(mix(2045, 2026, k * k * (3 - 2 * k))));
      year.style.opacity = win(t, w0, b - 0.1, 0.25, 0.3).toFixed(4);
      year.style.color = k >= 1 ? "#5eead4" : "#f4f7f9";
      year.style.transform = `scale(${(1 + 0.08 * Math.max(0, 1 - Math.abs(t - w1) / 0.25)).toFixed(4)})`;
      text("h_vuelves", t, a + 0.2, b - 0.05, 0.35, 0.2);
      show("flash", Math.max(0, 1 - Math.abs(t - (w1 - 0.02)) / 0.22) * 0.95);
    }
    // --- 2026: las señales ya estaban. La Tierra en 3D se convierte en el globo real de la aplicación, con El Niño a la vista.
    {
      const [a, b] = P.llegada;
      const s = mix(1.2, 1.26, prog(t, turn, b));
      cam("sc-mar", 1135 - 262 / s, 532, s, win(t, turn, b + 0.12, 0.6, 0.14));
      text("h_herramienta", t, a + 0.3, b - 0.05);
      text("k_mar", t, turn + 0.3, b - 0.05, 0.35, 0.2, 0);
      text("src_emergencia", t, turn + 0.5, b - 0.05, 0.35, 0.2, 0);
      left = Math.max(left, win(t, a + 0.2, b + 0.05, 0.4, 0.15));
    }
    // --- La plataforma: primero la vista general, con los datos a la vista; después, las cuatro preguntas del reto NASA,
    //     una por una al ritmo de la voz. Las dos son capturas de la aplicación.
    {
      const [a, b] = P.preguntas, q = V.v4, span = q.fin - q.inicio;
      const at = SPEC.cortes.preguntas.map((f) => q.inicio + span * f);
      const cut = Math.min(Math.max(at[0] - 0.2, a + 1.8), b - 2.4);       // de la vista general a las preguntas
      const g = prog(t, a, cut + 0.15);
      // La cámara se aleja: termina con la pantalla completa de la plataforma a la vista.
      cam("sc-plataforma", mix(1010, 960, g), mix(566, 556, g), mix(1.12, 1.0, g), win(t, a - 0.12, cut + 0.14, 0.25, 0.26));
      show("hl-serie", win(t, a + 0.8, cut + 0.1, 0.25, 0.2));
      text("k_plataforma", t, a + 0.2, cut, 0.3, 0.2, 0);
      // La cámara baja con la pregunta activa: la fila resaltada queda siempre entre las dos franjas.
      const pan = prog(t, at[1], at[3]);
      cam("sc-preguntas", 959.5, 455 + 20 * prog(t, cut, b) + 191 * pan * pan * (3 - 2 * pan), 1.32, win(t, cut - 0.12, b + 0.12, 0.26, 0.25));
      const active = t < at[0] ? -1 : t < at[1] ? 0 : t < at[2] ? 1 : t < at[3] ? 2 : 3;
      [...$("chips").children].forEach((el, i) => { el.className = i === active ? "on" : i < active ? "done" : ""; });
      $("chips").style.opacity = win(t, cut + 0.1, b - 0.05, 0.3, 0.2).toFixed(4);
      for (let i = 0; i < 4; i += 1) show(`hl-q${i}`, win(t, at[i], i < 3 ? at[i + 1] : b - 0.05, 0.18, 0.16));
      text("k_reto", t, cut + 0.15, P.fuentes[1] - 0.05, 0.3, 0.2, 0);
      show("bandB3", win(t, a, cut + 0.3, 0.3, 0.3));
      show("bandB", win(t, cut, b + 0.1, 0.3, 0.2));
    }
    // --- Segunda fuente: cuando no coinciden, se dice.
    {
      const [a, b] = P.fuentes;
      cam("sc-artefacto", 959.5, 440, mix(1.3, 1.34, prog(t, a, b)), win(t, a - 0.12, b + 0.1, 0.25, 0.2));
      show("hl-art", win(t, a + 0.12, b - 0.05, 0.2, 0.15));
      text("k_artefacto", t, a + 0.1, b - 0.05, 0.25, 0.15, 0);
      text("h_decimos", t, a + 0.05, b - 0.05, 0.3, 0.15);
    }
    // --- El videojuego: cada desastre lleva su lugar real y un paso de la misión.
    {
      const [a, b] = P.desastres, seg = SPEC.segmentos.find((s) => s.titulo && t >= s.inicio && t < s.fin);
      text("k_lugares", t, a + 0.1, b - 0.05, 0.3, 0.2, 0);
      const hazard = $("hazard"), step = $("step");
      if (seg) {
        hazard.querySelector(".place").textContent = seg.lugar;
        hazard.querySelector(".name").textContent = seg.titulo;
        step.textContent = seg.paso;
        const o = win(t, seg.inicio, seg.fin, 0.14, 0.1), p = out3((t - seg.inicio) / 0.3);
        hazard.style.opacity = step.style.opacity = o.toFixed(4);
        hazard.style.transform = `translateX(${((1 - p) * -46).toFixed(2)}px)`;
        step.style.transform = `translateX(${((1 - p) * 46).toFixed(2)}px)`;
      } else hazard.style.opacity = step.style.opacity = 0;
      bottom = Math.max(bottom, win(t, a, b, 0.15, 0.15));
    }
    // --- Rótulo de honestidad: qué es cinemática y qué es evento simulado.
    {
      const tag = $("tag"), disaster = t >= P.desastres[0] && t < P.desastres[1];
      tag.innerHTML = SPEC.textos[disaster ? "tag_desastre" : "tag_cine"];
      tag.style.opacity = (disaster ? win(t, P.desastres[0], P.desastres[1], 0.2, 0.15) : cine ? Math.max(win(t, 0.3, turn, 0.3, 0.3), win(t, P.sana[0], P.sana[1], 0.3, 0.2)) : 0).toFixed(4);
    }
    bottom = Math.max(bottom, win(t, P.sana[0], P.sana[1], 0.4, 0.3) * 0.85);
    show("scrimL", left);
    show("scrimB", bottom);
    show("bandT", win(t, P.preguntas[0], P.fuentes[1], 0.3, 0.2));
    show("bandB2", win(t, P.fuentes[0] - 0.1, P.fuentes[1], 0.2, 0.2));
    // --- La Tierra sana: para quién es y por qué importa.
    {
      const [a, b] = P.sana;
      text("k_para", t, a + 0.4, b - 0.1, 0.4, 0.25, 0);
      text("h_futuro", t, a + 0.8, b - 0.1, 0.45, 0.25);
    }
    // --- Cierre sobre el amanecer.
    {
      const [a, b] = P.cierre;
      show("scrimEnd", win(t, a, b + 1, 0.3, 0.3));
      const rise = (id, delay, dy = 22) => {
        const el = $(id), p = out3((t - a - delay) / 0.5);
        el.style.opacity = (t >= a + delay ? p : 0).toFixed(4);
        el.style.transform = `translateY(${((1 - p) * dy).toFixed(2)}px)`;
      };
      rise("fin_titulo", 0.1, 0);
      rise("fin_sub", 0.4, 0);
      rise("fin_lema", 0.65);
      rise("fin_equipo", 0.9);
      rise("fin_nombres", 1.05);
      rise("fin_reto", 1.2);
      rise("fin_creditos", 1.0, 0);
      const spacing = mix(0.26, 0.2, out3((t - a) / 2.2));
      $("fin_titulo").style.letterSpacing = `${spacing.toFixed(4)}em`;
      $("fin_titulo").style.textIndent = `${spacing.toFixed(4)}em`;
    }
    // --- Subtítulos en inglés (solo si la voz no está en inglés).
    {
      const line = SPEC.subtitulos ? Object.values(V).find((v) => t >= v.inicio - 0.05 && t <= v.fin + 0.2) : null;
      const box = $("subs");
      box.style.bottom = t >= P.cierre[0] ? "30px" : "76px";       // en el cierre baja para no tapar los créditos
      if (line) { box.firstElementChild.textContent = line.sub; box.style.opacity = win(t, line.inicio - 0.05, line.fin + 0.2, 0.12, 0.15).toFixed(4); } else box.style.opacity = 0;
    }
  };
</script>
</body>
