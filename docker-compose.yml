name: los-causas-espaciales

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["power-cache:/app/backend/data/cache"]
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_API_URL: http://api:8000
    ports: ["3100:3100"]
    depends_on: [api]
volumes:
  power-cache:
