.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;lce-roadmap&quot;&gt;
  &lt;style&gt;
    #lce-roadmap {
      --lce-ok: var(--viz-series-1);
      --lce-flow: var(--viz-series-2);
      --lce-warn: var(--viz-series-3);
      --lce-future: var(--viz-series-4);
      color: var(--foreground);
      display: grid;
      gap: 28px;
      width: 100%;
    }
    #lce-roadmap * { box-sizing: border-box; }
    #lce-roadmap .roadmap-header,
    #lce-roadmap .section-head,
    #lce-roadmap .viz-row { justify-content: space-between; }
    #lce-roadmap .roadmap-header { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    #lce-roadmap .brand-lockup { display: grid; gap: 4px; }
    #lce-roadmap .brand-lockup strong { letter-spacing: .06em; }
    #lce-roadmap .brand-lockup span { color: var(--muted-foreground); }
    #lce-roadmap .roadmap-nav { display: flex; gap: 18px; flex-wrap: wrap; }
    #lce-roadmap .roadmap-nav a { color: var(--foreground); text-decoration: none; padding-block: 6px; border-bottom: 2px solid transparent; }
    #lce-roadmap .roadmap-nav a:hover { border-color: var(--lce-flow); }
    #lce-roadmap .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    #lce-roadmap .viz-stat { min-height: 116px; }
    #lce-roadmap .phase-rail { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
    #lce-roadmap .phase-step { min-width: 0; min-height: 104px; display: grid; align-content: start; gap: 8px; text-align: left; }
    #lce-roadmap .phase-step span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); }
    #lce-roadmap .phase-step small { color: var(--muted-foreground); }
    #lce-roadmap .phase-step[aria-pressed=&quot;true&quot;] { box-shadow: inset 0 -3px 0 var(--lce-flow); }
    #lce-roadmap .phase-step[data-status=&quot;OPERATIVO&quot;] span { background: color-mix(in srgb, var(--lce-ok) 24%, transparent); }
    #lce-roadmap .phase-step[data-status=&quot;PARCIAL&quot;] span { background: color-mix(in srgb, var(--lce-flow) 24%, transparent); }
    #lce-roadmap .phase-step[data-status=&quot;PENDIENTE&quot;] span { background: color-mix(in srgb, var(--lce-warn) 24%, transparent); }
    #lce-roadmap .phase-step[data-status=&quot;FUTURO&quot;] span { background: color-mix(in srgb, var(--lce-future) 24%, transparent); }
    #lce-roadmap .phase-detail { display: grid; gap: 18px; }
    #lce-roadmap .phase-title-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    #lce-roadmap .phase-title-row h2 { margin: 0; }
    #lce-roadmap .detail-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
    #lce-roadmap .detail-cell { min-width: 0; }
    #lce-roadmap .detail-cell h3 { margin-top: 0; }
    #lce-roadmap .detail-cell p,
    #lce-roadmap .detail-cell li { color: var(--muted-foreground); }
    #lce-roadmap .detail-cell ul { margin: 0; padding-left: 18px; }
    #lce-roadmap .status-line { display: flex; gap: 8px; align-items: center; }
    #lce-roadmap .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lce-warn); }
    #lce-roadmap .status-dot[data-status=&quot;OPERATIVO&quot;] { background: var(--lce-ok); }
    #lce-roadmap .status-dot[data-status=&quot;PARCIAL&quot;] { background: var(--lce-flow); }
    #lce-roadmap .status-dot[data-status=&quot;FUTURO&quot;] { background: var(--lce-future); }
    #lce-roadmap .section-head { display: flex; gap: 16px; align-items: end; flex-wrap: wrap; }
    #lce-roadmap .section-head h2,
    #lce-roadmap .section-head p { margin: 0; }
    #lce-roadmap .section-head p { color: var(--muted-foreground); }
    #lce-roadmap .dop-shell { display: grid; gap: 18px; }
    #lce-roadmap .dop-legend { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted-foreground); }
    #lce-roadmap .dop-legend span { display: inline-flex; gap: 7px; align-items: center; }
    #lce-roadmap .symbol { width: 14px; height: 14px; display: inline-block; border: 2px solid currentColor; }
    #lce-roadmap .symbol.operation { border-radius: 50%; color: var(--lce-flow); }
    #lce-roadmap .symbol.inspection { color: var(--lce-warn); }
    #lce-roadmap .symbol.gate { transform: rotate(45deg); color: var(--lce-future); }
    #lce-roadmap .dop-flow { display: grid; grid-template-columns: 1.1fr 34px 1fr 34px 1fr 34px 1.25fr 34px 1fr; align-items: stretch; gap: 0; }
    #lce-roadmap .dop-stage { min-width: 0; display: grid; align-content: start; gap: 12px; padding: 16px 0; }
    #lce-roadmap .dop-stage + .dop-arrow + .dop-stage { border-top: 1px solid var(--border); }
    #lce-roadmap .dop-stage h3 { margin: 0; }
    #lce-roadmap .dop-node { display: grid; gap: 5px; padding: 12px; background: color-mix(in srgb, var(--card) 74%, transparent); border-left: 2px solid var(--border); }
    #lce-roadmap button.dop-node { width: 100%; color: var(--foreground); font: inherit; text-align: left; cursor: pointer; border-block: 0; border-right: 0; }
    #lce-roadmap button.dop-node:hover,
    #lce-roadmap button.dop-node[aria-pressed=&quot;true&quot;] { border-left-color: var(--lce-flow); background: var(--accent); color: var(--accent-foreground); }
    #lce-roadmap .dop-node small { color: var(--muted-foreground); }
    #lce-roadmap .dop-node strong { font-weight: 500; }
    #lce-roadmap .dop-node.future { border-left-color: var(--lce-future); }
    #lce-roadmap .dop-arrow { display: grid; place-items: center; color: var(--lce-flow); font-size: 22px; }
    #lce-roadmap .model-detail { color: var(--muted-foreground); border-left: 2px solid var(--lce-flow); padding-left: 12px; }
    #lce-roadmap .dependency-table { width: 100%; border-collapse: collapse; }
    #lce-roadmap .dependency-table th,
    #lce-roadmap .dependency-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    #lce-roadmap .dependency-table th { color: var(--muted-foreground); font-weight: 500; }
    #lce-roadmap .dependency-table td:last-child { white-space: nowrap; }
    #lce-roadmap .final-gates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    #lce-roadmap .final-gates section { border-top: 2px solid var(--border); padding-top: 14px; }
    #lce-roadmap .final-gates h3 { margin-top: 0; }
    #lce-roadmap .final-gates ul { padding-left: 18px; color: var(--muted-foreground); }
    @media (max-width: 980px) {
      #lce-roadmap .phase-rail { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      #lce-roadmap .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #lce-roadmap .detail-cell:last-child { grid-column: 1 / -1; }
      #lce-roadmap .dop-flow { grid-template-columns: 1fr; }
      #lce-roadmap .dop-arrow { min-height: 34px; transform: rotate(90deg); }
    }
    @media (max-width: 620px) {
      #lce-roadmap { gap: 22px; }
      #lce-roadmap .summary-grid,
      #lce-roadmap .final-gates { grid-template-columns: 1fr; }
      #lce-roadmap .phase-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #lce-roadmap .detail-grid { grid-template-columns: 1fr; }
      #lce-roadmap .detail-cell:last-child { grid-column: auto; }
      #lce-roadmap .dependency-table thead { display: none; }
      #lce-roadmap .dependency-table,
      #lce-roadmap .dependency-table tbody,
      #lce-roadmap .dependency-table tr,
      #lce-roadmap .dependency-table td { display: block; width: 100%; }
      #lce-roadmap .dependency-table tr { padding: 10px 0; border-bottom: 1px solid var(--border); }
      #lce-roadmap .dependency-table td { border: 0; padding: 4px 0; white-space: normal; }
      #lce-roadmap .dependency-table td::before { content: attr(data-label) &quot;: &quot;; color: var(--muted-foreground); }
    }
  &lt;/style&gt;

    &lt;/div&gt;

    &lt;div class=&quot;dop-flow&quot; role=&quot;group&quot; aria-label=&quot;Flujo de operaciones para modelos neuronales&quot;&gt;
      &lt;section class=&quot;dop-stage&quot;&gt;
        &lt;h3&gt;1 · Fuentes&lt;/h3&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;NASA / Earthdata&lt;/strong&gt;&lt;small&gt;POWER operativo; GPM, DEM y AppEEARS pendientes&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;Capas oficiales del Perú&lt;/strong&gt;&lt;small&gt;Red, ambiente, patrimonio y sociedad pendientes de integración&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;Supuestos del usuario&lt;/strong&gt;&lt;small&gt;Separados de observaciones y resultados de modelo&lt;/small&gt;&lt;/div&gt;
      &lt;/section&gt;
      &lt;div class=&quot;dop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;section class=&quot;dop-stage&quot;&gt;
        &lt;h3&gt;2 · Procedencia y QA&lt;/h3&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;Validación&lt;/strong&gt;&lt;small&gt;Producto, versión, unidad, CRS, tiempo, nodata y cobertura&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;Registro trazable&lt;/strong&gt;&lt;small&gt;Fuente, fecha, transformación, caché y clasificación de procedencia&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;Partición sin fuga&lt;/strong&gt;&lt;small&gt;Separación temporal y espacial antes de entrenar&lt;/small&gt;&lt;/div&gt;
      &lt;/section&gt;
      &lt;div class=&quot;dop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;section class=&quot;dop-stage&quot;&gt;
        &lt;h3&gt;3 · Ingeniería y baseline&lt;/h3&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;Características&lt;/strong&gt;&lt;small&gt;Series, relieve, distancia, cobertura y contexto sectorial&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;Baseline obligatorio&lt;/strong&gt;&lt;small&gt;Comparar contra reglas, regresión, árboles y modelos estadísticos&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;Gate de suficiencia&lt;/strong&gt;&lt;small&gt;Sin etiquetas y muestra suficiente no se autoriza una red neuronal&lt;/small&gt;&lt;/div&gt;
      &lt;/section&gt;
      &lt;div class=&quot;dop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;section class=&quot;dop-stage&quot;&gt;
        &lt;h3&gt;4 · Modelos candidatos&lt;/h3&gt;
        &lt;button class=&quot;dop-node future&quot; type=&quot;button&quot; data-model=&quot;temporal&quot; aria-pressed=&quot;true&quot;&gt;&lt;strong&gt;Modelo temporal&lt;/strong&gt;&lt;small&gt;TCN o Transformer temporal&lt;/small&gt;&lt;/button&gt;
        &lt;button class=&quot;dop-node future&quot; type=&quot;button&quot; data-model=&quot;spatial&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Modelo geoespacial&lt;/strong&gt;&lt;small&gt;CNN/U-Net o GNN según geometría&lt;/small&gt;&lt;/button&gt;
        &lt;button class=&quot;dop-node future&quot; type=&quot;button&quot; data-model=&quot;fusion&quot; aria-pressed=&quot;false&quot;&gt;&lt;strong&gt;Fusión inversión/riesgo&lt;/strong&gt;&lt;small&gt;Ensamble calibrado, no score opaco&lt;/small&gt;&lt;/button&gt;
      &lt;/section&gt;
      &lt;div class=&quot;dop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;section class=&quot;dop-stage&quot;&gt;
        &lt;h3&gt;5 · Control y uso&lt;/h3&gt;
        &lt;div class=&quot;dop-node&quot;&gt;&lt;strong&gt;Incertidumbre&lt;/strong&gt;&lt;small&gt;Calibración, intervalos, drift y validación fuera de muestra&lt;/small&gt;&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
